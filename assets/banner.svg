<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-label="Theodoros Nikaris — DevOps and Backend">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0b2030"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#334155" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1400" height="420" fill="url(#bg)"/>
  <rect width="1400" height="420" fill="url(#grid)"/>
  <rect width="1400" height="420" fill="url(#glow)"/>

  <!-- terminal window decoration, top right -->
  <g transform="translate(1010 96)" opacity="0.9">
    <rect x="0" y="0" width="318" height="196" rx="12" fill="#0f172a" stroke="#334155"/>
    <rect x="0" y="0" width="318" height="34" rx="12" fill="#16202f"/>
    <circle cx="22" cy="17" r="5" fill="#f87171"/>
    <circle cx="40" cy="17" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="17" r="5" fill="#34d399"/>
    <text x="18" y="66" fill="#7dd3fc" font-family="Consolas,Menlo,monospace" font-size="16">docker compose up -d</text>
    <text x="18" y="94" fill="#a5b4fc" font-family="Consolas,Menlo,monospace" font-size="16">systemd --status ok</text>
    <text x="18" y="122" fill="#7dd3fc" font-family="Consolas,Menlo,monospace" font-size="16">git push --atomic main</text>
    <text x="18" y="150" fill="#34d399" font-family="Consolas,Menlo,monospace" font-size="16">deploy complete &#10003;</text>
  </g>

  <!-- accent bar + names -->
  <rect x="72" y="128" width="10" height="132" rx="5" fill="url(#accent)"/>
  <text x="112" y="188" fill="#f8fafc" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="62" font-weight="700">Theodoros Nikaris</text>
  <text x="112" y="240" fill="#94a3b8" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26">DevOps &amp; Backend — resilient services, clean configs, actual deploys</text>

  <!-- stack chips -->
  <g font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17">
    <g>
      <rect x="112" y="280" width="122" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
      <text x="141" y="304" fill="#7dd3fc">Java 21</text>
    </g>
    <g>
      <rect x="246" y="280" width="118" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
      <text x="283" y="304" fill="#7dd3fc">Python</text>
    </g>
    <g>
      <rect x="376" y="280" width="110" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
      <text x="404" y="304" fill="#7dd3fc">FastAPI</text>
    </g>
    <g>
      <rect x="498" y="280" width="98" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
      <text x="517" y="304" fill="#7dd3fc">Docker</text>
    </g>
    <g>
      <rect x="608" y="280" width="116" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
      <text x="630" y="304" fill="#7dd3fc">Postgres</text>
    </g>
    <g>
      <rect x="736" y="280" width="96" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
      <text x="762" y="304" fill="#7dd3fc">Astro</text>
    </g>
    <g>
      <rect x="844" y="280" width="104" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
      <text x="867" y="304" fill="#7dd3fc">React</text>
    </g>
  </g>

  <text x="112" y="366" fill="#64748b" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17">github.com/thodorakos</text>
</svg>
