<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="208" viewBox="0 0 1000 208" role="img" aria-labelledby="title description">
  <title id="title">Theodoros Nikaris</title>
  <desc id="description">DevOps and backend development. A packet loops through the connected-service diagram, with a brief pause between passes.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#2B3A8F"/>
      <stop offset=".58" stop-color="#2B3A8F"/>
      <stop offset="1" stop-color="#1E6E4D"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#F8F7F2" opacity=".15"/>
    </pattern>
  </defs>
  <style>
    .packet, .node-glow { opacity: 0; }
    .packet { animation: packet-flow 5s linear infinite; }
    .node-glow { animation: node-pulse 5s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
    .glow-container { animation-delay: 50ms; }
    .glow-server { animation-delay: 1350ms; }
    .glow-api { animation-delay: 3350ms; }
    @keyframes packet-flow {
      0% { transform: translate(822px, 108px); opacity: 0; }
      4% { opacity: 1; }
      12.8% { transform: translate(864px, 108px); }
      22.4% { transform: translate(864px, 64px); }
      30.4%, 34.4% { transform: translate(902px, 64px); }
      43.2% { transform: translate(864px, 64px); }
      52.8% { transform: translate(864px, 108px); }
      62.4% { transform: translate(864px, 152px); }
      72% { transform: translate(902px, 152px); opacity: 1; }
      80% { transform: translate(902px, 152px); opacity: 0; }
      100% { transform: translate(822px, 108px); opacity: 0; }
    }
    @keyframes node-pulse {
      0%, 12%, 100% { opacity: 0; }
      4.8% { opacity: .65; }
    }
    @media (prefers-reduced-motion: reduce) {
      .packet, .node-glow { animation: none; }
    }
  </style>
  <g>
    <rect width="1000" height="208" rx="16" fill="url(#background)"/>
    <rect x="748" width="252" height="208" fill="url(#dots)"/>
    <text x="48" y="100" fill="#F8F7F2" font-family="DejaVu Sans, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5">Theodoros Nikaris</text>
    <text x="50" y="152" fill="#F8F7F2" font-family="DejaVu Sans, Arial, sans-serif" font-size="36">DevOps / Backend</text>
    <g stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M822 108h42V64h38" fill="none" stroke="#F8F7F2" stroke-opacity=".7"/>
      <path d="M864 108v44h38" fill="none" stroke="#F8F7F2" stroke-opacity=".7"/>
      <circle cx="864" cy="108" r="4" fill="#F8F7F2" stroke="#2B3A8F"/>
      <rect x="778" y="86" width="44" height="44" rx="10" fill="#2B3A8F" stroke="#F8F7F2"/>
      <path d="m800 97 10 5v12l-10 5-10-5v-12zm-10 5 10 5 10-5m-10 5v12" fill="none" stroke="#F8F7F2"/>
      <rect x="902" y="42" width="44" height="44" rx="10" fill="#2B3A8F" stroke="#F8F7F2"/>
      <path d="M915 57h18m-18 7h18m-18 7h10" stroke="#F8F7F2"/>
      <rect x="902" y="130" width="44" height="44" rx="10" fill="#1E6E4D" stroke="#F8F7F2"/>
      <path d="m918 146-6 6 6 6m12-12 6 6-6 6m-4-15-4 18" fill="none" stroke="#F8F7F2"/>
    </g>
    <g fill="none" stroke-width="3">
      <rect class="node-glow glow-container" x="776" y="84" width="48" height="48" rx="12" stroke="#F8F7F2"/>
      <rect class="node-glow glow-server" x="900" y="40" width="48" height="48" rx="12" stroke="#F8F7F2"/>
      <rect class="node-glow glow-api" x="900" y="128" width="48" height="48" rx="12" stroke="#F8F7F2"/>
    </g>
    <g class="packet">
      <circle r="7" fill="#F8F7F2" opacity=".18"/>
      <circle r="3" fill="#1E6E4D" stroke="#F8F7F2" stroke-width="1"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="207" rx="15.5" fill="none" stroke="#F8F7F2" stroke-opacity=".3"/>
</svg>
