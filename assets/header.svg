<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="224" viewBox="0 0 1000 224" role="img" aria-labelledby="title description">
  <title id="title">Theodoros Nikaris</title>
  <desc id="description">DevOps and backend development. A packet travels through the connected-service diagram for four seconds, then the illustration rests.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#2B3A8F"/>
      <stop offset="1" stop-color="#1E6E4D"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#F8F7F2" opacity=".15"/>
    </pattern>
  </defs>
  <style>
    .packet, .node-glow { opacity: 0; }
    .packet { animation: packet-flow 4s linear 1; }
    .node-glow { animation: node-pulse 600ms cubic-bezier(0.23, 1, 0.32, 1) 1; }
    .glow-container { animation-delay: 50ms; }
    .glow-server { animation-delay: 1350ms; }
    .glow-api { animation-delay: 3350ms; }
    @keyframes packet-flow {
      0% { transform: translate(822px, 108px); opacity: 0; }
      5% { opacity: 1; }
      16% { transform: translate(864px, 108px); }
      28% { transform: translate(864px, 64px); }
      38%, 43% { transform: translate(902px, 64px); }
      54% { transform: translate(864px, 64px); }
      66% { transform: translate(864px, 108px); }
      78% { transform: translate(864px, 152px); }
      90% { transform: translate(902px, 152px); opacity: 1; }
      100% { transform: translate(902px, 152px); opacity: 0; }
    }
    @keyframes node-pulse {
      0%, 100% { opacity: 0; }
      40% { opacity: .65; }
    }
    @keyframes node-pulse-reduced {
      0%, 100% { opacity: 0; }
      40% { opacity: .2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .packet { animation: none; }
      .node-glow { animation-name: node-pulse-reduced; animation-duration: 200ms; }
    }
  </style>
  <g>
    <rect width="1000" height="224" rx="16" fill="url(#background)"/>
    <rect x="748" width="252" height="224" fill="url(#dots)"/>
    <path d="M48 42h40" stroke="#F8F7F2" stroke-width="3" stroke-linecap="round"/>
    <path d="M98 42h20" stroke="#F8F7F2" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <text x="48" y="111" fill="#F8F7F2" font-family="DejaVu Sans, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Theodoros Nikaris</text>
    <text x="50" y="163" fill="#F8F7F2" font-family="DejaVu Sans, Arial, sans-serif" font-size="36">DevOps / Backend</text>
    <g stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M822 108h42V64h38" fill="none" stroke="#F8F7F2" stroke-opacity=".7"/>
      <path d="M864 108v44h38" fill="none" stroke="#F8F7F2" stroke-opacity=".7"/>
      <circle cx="864" cy="108" r="4" fill="#F8F7F2" stroke="#2B3A8F"/>
      <rect x="778" y="86" width="44" height="44" rx="10" fill="#2B3A8F" stroke="#F8F7F2"/>
      <path d="m800 97 10 5v12l-10 5-10-5v-12zm-10 5 10 5 10-5m-10 5v12" fill="none" stroke="#F8F7F2"/>
      <rect x="902" y="42" width="44" height="44" rx="10" fill="#2B3A8F" stroke="#F8F7F2"/>
      <path d="M915 57h18m-18 7h18m-18 7h10" stroke="#F8F7F2"/>
      <rect x="902" y="130" width="44" height="44" rx="10" fill="#1E6E4D" stroke="#F8F7F2"/>
      <path d="m918 146-6 6 6 6m12-12 6 6-6 6m-4-15-4 18" fill="none" stroke="#F8F7F2"/>
    </g>
    <g fill="none" stroke-width="3">
      <rect class="node-glow glow-container" x="776" y="84" width="48" height="48" rx="12" stroke="#F8F7F2"/>
      <rect class="node-glow glow-server" x="900" y="40" width="48" height="48" rx="12" stroke="#F8F7F2"/>
      <rect class="node-glow glow-api" x="900" y="128" width="48" height="48" rx="12" stroke="#F8F7F2"/>
    </g>
    <g class="packet">
      <circle r="7" fill="#F8F7F2" opacity=".18"/>
      <circle r="3" fill="#1E6E4D" stroke="#F8F7F2" stroke-width="1"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="223" rx="15.5" fill="none" stroke="#F8F7F2" stroke-opacity=".3"/>
</svg>
